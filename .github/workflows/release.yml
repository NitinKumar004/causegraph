name: release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# This builds the self-contained per-platform archives and publishes them, so users
# can `curl … install.sh | sh` — no Go, no build.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build engine venv (source of the vendored networkx)
        run: make build

      - name: Package release archives
        run: scripts/package.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz --generate-notes --title "${GITHUB_REF_NAME}"
