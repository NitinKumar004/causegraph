name: release

# Cut a release by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
# This builds the self-contained per-platform archives and publishes them, so users
# can `curl … install.sh | sh` — no Go, no build.

on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the GitHub Release
  id-token: write       # OIDC for keyless build-provenance signing
  attestations: write   # store the provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build engine venv (source of the vendored networkx)
        run: make build

      - name: Package release archives
        run: scripts/package.sh "${GITHUB_REF_NAME}"

      # Keyless (Sigstore/OIDC) provenance that GitHub's CI built these exact bytes.
      # `gh attestation verify` in install.sh checks it — no maintainer-held key needed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/*.tar.gz'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # ship SHA256SUMS alongside the archives so the installer can verify integrity
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS --generate-notes --title "${GITHUB_REF_NAME}"

      # Update the Homebrew tap so `brew upgrade causegraph` gets the new version. No-op until
      # a TAP_TOKEN secret (a PAT with push access to NitinKumar004/homebrew-causegraph) is set.
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "TAP_TOKEN not set — skipping Homebrew tap update."; exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          scripts/render-homebrew-formula.sh "$version" dist/SHA256SUMS > causegraph.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/NitinKumar004/homebrew-causegraph.git" tap
          mkdir -p tap/Formula
          cp causegraph.rb tap/Formula/causegraph.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/causegraph.rb
          git commit -m "causegraph ${GITHUB_REF_NAME}" || { echo "no change"; exit 0; }
          git push
